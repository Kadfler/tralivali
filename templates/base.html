{% load static %}
<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Travel{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

<header class="catalog-header position-relative d-flex flex-column justify-content-between text-white"
        style="min-height: 25vh; background: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)),
                   url('{% if header_settings %}{{ header_settings.background_image.url }}{% else %}/static/img/default-bg.jpg{% endif %}') no-repeat center/cover;">

    <nav class="navbar navbar-expand-lg navbar-dark pt-3">
        <div class="container">
            <a class="navbar-brand fw-bold fs-3" href="/">
                <img src="{% static 'img/logo.png' %}" alt="Логотип" height="40"
                     class="d-inline-block align-text-top me-2">
                TravelAgency
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav gap-3">
                    <li class="nav-item">
                        <a class="btn btn-outline-light rounded-pill px-4" href="{% url 'catalog' %}">Каталог</a>
                    </li>
                    <li class="nav-item">
                        {% if user.is_authenticated %}
                        <a class="btn btn-outline-light rounded-pill px-4" href="{% url 'profile' %}">Личный кабинет</a>
                        {% else %}
                        <a class="btn btn-warning rounded-pill px-4 text-dark fw-semibold"
                           href="{% url 'login' %}">Вход</a>
                        {% endif %}
                    </li>
                </ul>
            </div>
        </div>
    </nav>

</header>

<!-- Основной контент (например, поиск и каталог) встанет строго ПОД шапкой -->
<main>
    {% block content %}{% endblock %}
</main>

<footer class="site-footer py-4 mt-5">
    <div class="container-fluid px-3 px-lg-5">
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-center gap-2">
            <div>
                <div class="fw-semibold text-white">MyTravel</div>
                <small class="text-white-50">Travel smarter and faster.</small>
            </div>
            <small class="text-white-50">© 2026</small>
        </div>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{% static 'js/main.js' %}"></script>
</body>
</html>
